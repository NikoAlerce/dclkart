<!DOCTYPE html>
<!-- GLB Editor v3 - lazy loading -->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GLB Editor — Decentraland</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#080810;color:#e0e0f0;overflow:hidden;height:100vh;display:flex}

/* ── SIDEBAR ── */
#sidebar{width:310px;min-width:310px;background:rgba(10,10,20,.98);border-right:1px solid rgba(124,58,237,.2);display:flex;flex-direction:column;z-index:10;overflow:hidden}

.panel{border-bottom:1px solid rgba(124,58,237,.12);flex-shrink:0}
.panel-head{padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:background .15s}
.panel-head:hover{background:rgba(124,58,237,.07)}
.panel-head h3{font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9f7aea}
.panel-head .arrow{font-size:.7rem;color:#555;transition:transform .2s}
.panel-body{overflow:hidden;transition:max-height .25s ease}
.panel-body.collapsed{max-height:0!important}

/* ── World Info ── */
#world-info{padding:12px 14px 14px}
.wi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wi-stat{background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.15);border-radius:8px;padding:8px 10px;text-align:center}
.wi-stat .wlabel{font-size:.66rem;color:#777;margin-bottom:3px}
.wi-stat .wval{font-size:1.05rem;font-weight:700;color:#c4b5fd}
.wi-stat .wunit{font-size:.65rem;color:#666;margin-top:1px}

.parcel-editor h4{font-size:.72rem;color:#888;margin-bottom:8px;font-weight:600}
.parcel-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.parcel-row label{font-size:.7rem;color:#777;width:60px;flex-shrink:0}
.parcel-row input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(124,58,237,.2);border-radius:6px;padding:5px 8px;color:#e0e0ff;font-size:.8rem;outline:none;transition:border-color .2s;font-family:monospace}
.parcel-row input:focus{border-color:#7c3aed}
.btn-parcels{width:100%;padding:7px;border-radius:8px;border:none;background:linear-gradient(135deg,#7c3aed,#0891b2);color:#fff;font-size:.76rem;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s}
.btn-parcels:hover{opacity:.85}
.parcel-warning{font-size:.68rem;color:#f59e0b;margin-top:6px;padding:5px 8px;background:rgba(245,158,11,.08);border-radius:6px;border:1px solid rgba(245,158,11,.2)}

/* ── Model list ── */
#model-list-body{padding:10px 12px;max-height:180px;overflow-y:auto}
#model-list-body::-webkit-scrollbar{width:3px}
#model-list-body::-webkit-scrollbar-thumb{background:#7c3aed44;border-radius:4px}
.model-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:7px;border:1px solid rgba(124,58,237,.12);margin-bottom:4px;cursor:pointer;transition:all .12s}
.model-row:hover{border-color:#7c3aed;background:rgba(124,58,237,.07)}
.model-row.loaded{border-color:#06b6d4;background:rgba(6,182,212,.06)}
.model-row .mname{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.model-row .minfo{display:flex;align-items:center;gap:5px;flex-shrink:0}
.model-row .msize{font-size:.66rem;color:#666}
.dot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0;transition:background .2s}
.dot.on{background:#06b6d4}
.load-all{width:100%;padding:6px;border-radius:7px;border:1px dashed rgba(124,58,237,.3);background:transparent;color:#9f7aea;font-size:.74rem;font-weight:600;cursor:pointer;margin:4px 12px 10px;width:calc(100% - 24px);transition:all .15s}
.load-all:hover{border-color:#7c3aed;background:rgba(124,58,237,.1)}

/* ── Entity cards ── */
#entity-body{overflow-y:auto;flex:1;padding:10px 12px}
#entity-body::-webkit-scrollbar{width:3px}
#entity-body::-webkit-scrollbar-thumb{background:#7c3aed44;border-radius:4px}
.ecard{background:rgba(124,58,237,.05);border:1px solid rgba(124,58,237,.15);border-radius:9px;padding:10px 11px;margin-bottom:8px;transition:all .15s}
.ecard.highlight{border-color:#06b6d4;background:rgba(6,182,212,.06)}
.ecard .etitle{font-size:.8rem;font-weight:700;color:#c4b5fd;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.ecard .etitle span{font-size:.65rem;color:#666;font-weight:400;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xyz-row{display:flex;gap:5px;margin-bottom:5px}
.xyz-wrap{flex:1;display:flex;flex-direction:column;gap:2px}
.xyz-wrap label{font-size:.62rem;color:#777;text-align:center;font-weight:600}
.xyz-wrap input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(124,58,237,.2);border-radius:5px;padding:4px 5px;color:#e0e0ff;font-size:.76rem;text-align:center;outline:none;font-family:monospace;transition:border-color .15s}
.xyz-wrap input:focus{border-color:#7c3aed}
.ecard-btns{display:flex;gap:5px}
.btn-save{flex:1;padding:5px;border-radius:6px;border:none;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:.72rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.85}
.btn-eye{padding:5px 9px;border-radius:6px;border:1px solid rgba(6,182,212,.3);background:transparent;color:#67e8f9;font-size:.72rem;cursor:pointer}
.btn-eye:hover{background:rgba(6,182,212,.1)}

#status-bar{padding:8px 12px;border-top:1px solid rgba(124,58,237,.12);font-size:.7rem;flex-shrink:0;display:flex;align-items:center;gap:7px;background:rgba(8,8,16,.5)}
#sdot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── VIEWPORT ── */
#viewport{flex:1;position:relative;overflow:hidden;background:#080810}

#hud{position:absolute;top:10px;left:10px;background:rgba(8,8,16,.85);backdrop-filter:blur(10px);border:1px solid rgba(124,58,237,.18);border-radius:9px;padding:8px 12px;font-size:.7rem}
.hr{display:flex;gap:10px;margin-bottom:2px}.hr:last-child{margin:0}
.hl{color:#666}.hv{color:#06b6d4;font-family:monospace;font-weight:600}

#toolbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(10,10,20,.9);backdrop-filter:blur(14px);border:1px solid rgba(124,58,237,.2);border-radius:12px;padding:7px 10px;white-space:nowrap}
.tb{padding:5px 12px;border-radius:8px;border:1px solid rgba(124,58,237,.25);background:rgba(124,58,237,.07);color:#c4b5fd;font-size:.74rem;font-weight:600;cursor:pointer;transition:all .12s}
.tb:hover{background:rgba(124,58,237,.18);color:#fff}
.tb.on{background:linear-gradient(135deg,#7c3aed,#06b6d4);border-color:transparent;color:#fff}

#toast{position:absolute;top:12px;right:12px;padding:9px 14px;border-radius:9px;font-size:.76rem;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:240px}
#toast.ok{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35);color:#4ade80;opacity:1}
#toast.err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);color:#f87171;opacity:1}

#loadingVeil{position:absolute;inset:0;background:rgba(8,8,16,.65);display:flex;align-items:center;justify-content:center;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#loadingVeil.on{opacity:1;pointer-events:all}
.spin{width:32px;height:32px;border:3px solid rgba(124,58,237,.2);border-top-color:#7c3aed;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="sidebar">

  <!-- WORLD INFO -->
  <div class="panel">
    <div class="panel-head" onclick="toggle('world-body','world-arrow')">
      <h3>🌐 World Info</h3>
      <span class="arrow" id="world-arrow">▼</span>
    </div>
    <div class="panel-body" id="world-body" style="max-height:400px">
      <div id="world-info">
        <div class="wi-grid" id="wi-grid">
          <div class="wi-stat"><div class="wlabel">Parcelas</div><div class="wval" id="wi-total">—</div></div>
          <div class="wi-stat"><div class="wlabel">Tamaño</div><div class="wval" id="wi-size">—</div><div class="wunit">metros</div></div>
          <div class="wi-stat"><div class="wlabel">Ancho</div><div class="wval" id="wi-cols">—</div><div class="wunit">parcelas</div></div>
          <div class="wi-stat"><div class="wlabel">Alto</div><div class="wval" id="wi-rows">—</div><div class="wunit">parcelas</div></div>
        </div>
        <div class="parcel-editor">
          <h4>✏️ Cambiar tamaño del World</h4>
          <div class="parcel-row"><label>Columnas</label><input type="number" id="p-cols" min="1" max="30" value="1"></div>
          <div class="parcel-row"><label>Filas</label><input type="number" id="p-rows" min="1" max="30" value="1"></div>
          <div class="parcel-row"><label>Base X</label><input type="number" id="p-bx" value="0"></div>
          <div class="parcel-row"><label>Base Z</label><input type="number" id="p-bz" value="0"></div>
          <button class="btn-parcels" onclick="applyParcels()">💾 Guardar en scene.json</button>
          <div class="parcel-warning">⚠ Cambiar parcelas solo afecta preview local. Para el World en DCL, esto se ignora.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODELOS -->
  <div class="panel">
    <div class="panel-head" onclick="toggle('model-list-body','model-arrow')">
      <h3>📦 Modelos <span id="model-count-lbl" style="color:#555;font-weight:400;text-transform:none;letter-spacing:0">(0)</span></h3>
      <span class="arrow" id="model-arrow">▼</span>
    </div>
    <div class="panel-body" id="model-list-body" style="max-height:200px">
      <div id="model-list" style="padding:10px 12px"><div style="color:#666;font-size:.78rem;text-align:center">Cargando...</div></div>
      <button class="load-all" onclick="loadAll()">⬆ Cargar todos</button>
    </div>
  </div>

  <!-- POSICIONES -->
  <div class="panel" style="border:none;flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div class="panel-head" onclick="toggle('entity-body','entity-arrow')">
      <h3>📍 Posiciones index.ts</h3>
      <span class="arrow" id="entity-arrow">▼</span>
    </div>
    <div class="panel-body" id="entity-body" style="max-height:9999px;flex:1;overflow-y:auto;padding:10px 12px">
      <div id="entity-list" style="color:#666;font-size:.78rem;text-align:center;padding:16px">Cargando...</div>
    </div>
  </div>

  <div id="status-bar">
    <div id="sdot"></div>
    <span id="stext">Conectando...</span>
  </div>
</div>

<!-- VIEWPORT -->
<div id="viewport">
  <div id="loadingVeil"><div class="spin"></div></div>
  <div id="hud">
    <div class="hr"><span class="hl">Cam:</span><span class="hv" id="hcam">—</span></div>
    <div class="hr"><span class="hl">Modelos:</span><span class="hv" id="hmod">0</span></div>
  </div>
  <div id="toolbar">
    <button class="tb on" id="tb-grid"  onclick="toggleGrid()">⊞ Grid</button>
    <button class="tb on" id="tb-bbox"  onclick="toggleBBox()">□ Bounds</button>
    <button class="tb"    id="tb-wire"  onclick="toggleWire()">⬡ Wire</button>
    <button class="tb"    onclick="focusAll()">🎯 Todo</button>
    <span style="color:rgba(124,58,237,.3);margin:0 4px">|</span>
    <button class="tb on" id="tb-mode-translate" onclick="setGizmoMode('translate')">↕ Mover</button>
    <button class="tb"    id="tb-mode-rotate"    onclick="setGizmoMode('rotate')">↻ Rotar</button>
    <button class="tb"    id="tb-mode-scale"     onclick="setGizmoMode('scale')">⤢ Escalar</button>
  </div>
  <div id="toast"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js'
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js'
import { TransformControls } from 'three/addons/controls/TransformControls.js'

const API = window.location.origin

// ── THREE SCENE ─────────────────────────────────────────────
const vp = document.getElementById('viewport')
const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setSize(vp.clientWidth, vp.clientHeight)
renderer.outputColorSpace    = THREE.SRGBColorSpace
renderer.toneMapping         = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
renderer.shadowMap.enabled   = true
vp.appendChild(renderer.domElement)

const scene  = new THREE.Scene()
scene.background = new THREE.Color(0x080810)
scene.fog = new THREE.FogExp2(0x080810, 0.0005)

const camera = new THREE.PerspectiveCamera(60, vp.clientWidth/vp.clientHeight, 0.1, 50000)
camera.position.set(200, 120, 300)

const ctrl = new OrbitControls(camera, renderer.domElement)
ctrl.enableDamping = true; ctrl.dampingFactor = 0.07; ctrl.screenSpacePanning = true

// Evitar que la cámara se trabe al hacer mucho zoom cerca del target
let updatingTarget = false
ctrl.addEventListener('change', () => {
  if (updatingTarget) return
  const dist = camera.position.distanceTo(ctrl.target)
  if (dist < 5.0) {
    updatingTarget = true
    const dir = new THREE.Vector3()
    camera.getWorldDirection(dir)
    ctrl.target.copy(camera.position).addScaledVector(dir, 12.0)
    ctrl.update()
    updatingTarget = false
  }
})

scene.add(new THREE.AmbientLight(0xffffff, 0.7))
const sun = new THREE.DirectionalLight(0xfff5e0, 1.3)
sun.position.set(300, 500, 200); sun.castShadow = true
sun.shadow.mapSize.set(2048,2048)
const sc = sun.shadow.camera; sc.near=1; sc.far=8000; sc.left=sc.bottom=-1000; sc.right=sc.top=1000
scene.add(sun)
scene.add(new THREE.DirectionalLight(0xc0d8ff, 0.3).position.set(-200,100,-300) && new THREE.DirectionalLight(0xc0d8ff,0.3))

const grid = new THREE.GridHelper(6000,120,0x2a1f3d,0x140d20)
scene.add(grid)
const axes = new THREE.AxesHelper(300)
scene.add(axes)

// ── TRANSFORM CONTROLS & SELECTION ──────────────────────────
const transformControls = new TransformControls(camera, renderer.domElement)
scene.add(transformControls)

const undoStack = []
let startScale = new THREE.Vector3()

transformControls.addEventListener('dragging-changed', (event) => {
  ctrl.enabled = !event.value
  
  if (event.value) {
    if (transformControls.getMode() === 'scale' && selectedObjects.length > 0) {
      const target = selectedObjects.length === 1 ? selectedObjects[0] : selectionGroup
      startScale.copy(target.scale)
    }
    
    // Al iniciar el arrastre: guardar el estado de partida de los objetos seleccionados
    const state = selectedObjects.map(obj => {
      const entIdx = obj.userData.entityIndex
      if (entIdx !== undefined) {
        return {
          entityIndex: entIdx,
          varName: ents[entIdx].varName,
          position: obj.position.clone(),
          quaternion: obj.quaternion.clone(),
          scale: obj.scale.clone()
        }
      }
      return null
    }).filter(x => x !== null)
    
    if (state.length > 0) {
      undoStack.push(state)
      if (undoStack.length > 50) {
        undoStack.shift()
      }
    }
  }
  // Siempre guardar al soltar
  saveSelectedPositions()
})

transformControls.addEventListener('objectChange', () => {
  if (transformControls.getMode() === 'scale' && selectedObjects.length > 0) {
    const target = selectedObjects.length === 1 ? selectedObjects[0] : selectionGroup
    
    const rx = startScale.x > 0 ? (target.scale.x / startScale.x) : 1
    const ry = startScale.y > 0 ? (target.scale.y / startScale.y) : 1
    const rz = startScale.z > 0 ? (target.scale.z / startScale.z) : 1
    
    const devX = Math.abs(rx - 1)
    const devY = Math.abs(ry - 1)
    const devZ = Math.abs(rz - 1)
    
    let ratio = 1
    if (devX >= devY && devX >= devZ) ratio = rx
    else if (devY >= devX && devY >= devZ) ratio = ry
    else ratio = rz
    
    target.scale.set(
      startScale.x * ratio,
      startScale.y * ratio,
      startScale.z * ratio
    )
  }
  
  updateGizmoPositionsUI()
})

let selectedObjects = []
const selectionGroup = new THREE.Group()
scene.add(selectionGroup)

// ── STATE ─────────────────────────────────────────────────────
let loaded  = {}    // filename → {root, bboxHelper}
let ents    = []    // from index.ts + kartConfig.ts
let avail   = []    // from /api/models
let showBBox = true
let showWire = false

// ── UTILS ─────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = type
  clearTimeout(el._t)
  el._t = setTimeout(() => el.className = '', 2800)
}

function setLoading(v) { document.getElementById('loadingVeil').classList.toggle('on', v) }

function toggle(bodyId, arrowId) {
  const body  = document.getElementById(bodyId)
  const arrow = document.getElementById(arrowId)
  const collapsed = body.classList.toggle('collapsed')
  arrow.textContent = collapsed ? '▶' : '▼'
}

function setStatus(ok, txt) {
  document.getElementById('sdot').style.background = ok ? '#22c55e' : '#ef4444'
  document.getElementById('stext').textContent = txt
}

// ── SELECTION LOGIC ───────────────────────────────────────────
function selectObject(obj, isMulti) {
  if (!isMulti) {
    clearSelection()
    selectedObjects = [obj]
  } else {
    const idx = selectedObjects.indexOf(obj)
    if (idx !== -1) {
      selectedObjects.splice(idx, 1)
      setBBoxColor(obj, 0x7c3aed)
    } else {
      selectedObjects.push(obj)
    }
  }
  
  selectedObjects.forEach(o => {
    setBBoxColor(o, 0x06b6d4)
  })
  
  updateSidebarHighlights()
  updateGizmo()
}

function clearSelection() {
  selectedObjects.forEach(o => {
    setBBoxColor(o, 0x7c3aed)
  })
  
  transformControls.detach()
  
  if (selectionGroup.children.length > 0) {
    const tempChildren = [...selectionGroup.children]
    tempChildren.forEach(child => {
      scene.attach(child)
    })
  }
  
  selectedObjects = []
  updateSidebarHighlights()
}

function setBBoxColor(obj, hexColor) {
  const filename = obj.userData.filename
  if (loaded[filename] && loaded[filename].bboxHelper) {
    loaded[filename].bboxHelper.material.color.setHex(hexColor)
  }
}

function updateSidebarHighlights() {
  document.querySelectorAll('.ecard').forEach(c => c.classList.remove('highlight'))
  selectedObjects.forEach(obj => {
    const entIdx = obj.userData.entityIndex
    if (entIdx !== undefined) {
      const card = document.getElementById(`ec-${entIdx}`)
      if (card) {
        card.classList.add('highlight')
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
      }
    }
  })
}

function updateGizmo() {
  if (selectedObjects.length === 0) {
    transformControls.detach()
    return
  }
  
  if (selectionGroup.children.length > 0) {
    const tempChildren = [...selectionGroup.children]
    tempChildren.forEach(child => {
      scene.attach(child)
    })
  }
  
  if (selectedObjects.length === 1) {
    transformControls.attach(selectedObjects[0])
  } else {
    const center = new THREE.Vector3()
    selectedObjects.forEach(obj => {
      const worldPos = new THREE.Vector3()
      obj.getWorldPosition(worldPos)
      center.add(worldPos)
    })
    center.divideScalar(selectedObjects.length)
    
    selectionGroup.position.copy(center)
    selectionGroup.rotation.set(0, 0, 0)
    selectionGroup.scale.set(1, 1, 1)
    selectionGroup.updateMatrixWorld()
    
    selectedObjects.forEach(obj => {
      selectionGroup.attach(obj)
    })
    
    transformControls.attach(selectionGroup)
  }
}

// ── CLICK DETECTOR ────────────────────────────────────────────
const raycaster = new THREE.Raycaster()
const mouse = new THREE.Vector2()
let pointerDownX = 0
let pointerDownY = 0

vp.addEventListener('pointerdown', (e) => {
  pointerDownX = e.clientX
  pointerDownY = e.clientY
})

vp.addEventListener('pointerup', (e) => {
  if (transformControls.dragging) return
  
  const dx = e.clientX - pointerDownX
  const dy = e.clientY - pointerDownY
  if (Math.sqrt(dx*dx + dy*dy) > 5) return
  
  const rect = renderer.domElement.getBoundingClientRect()
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1
  
  raycaster.setFromCamera(mouse, camera)
  
  const objectsToIntersect = []
  Object.values(loaded).forEach(m => {
    objectsToIntersect.push(m.root)
  })
  
  const intersects = raycaster.intersectObjects(objectsToIntersect, true)
  
  if (intersects.length > 0) {
    const hitObj = getRootObject(intersects[0].object)
    if (hitObj) {
      selectObject(hitObj, e.shiftKey)
    }
  } else {
    if (!e.shiftKey) {
      clearSelection()
    }
  }
})

// Desactivar OrbitControls al mantener Shift para que no interfiera con la selección múltiple (evita que panee la cámara)
window.addEventListener('keydown', (e) => {
  if (e.key === 'Shift') {
    ctrl.enabled = false
  }
})

window.addEventListener('keyup', (e) => {
  if (e.key === 'Shift') {
    ctrl.enabled = true
  }
})

window.addEventListener('blur', () => {
  ctrl.enabled = true
})

function setGizmoMode(mode) {
  transformControls.setMode(mode)
  
  const btnTrans = document.getElementById('tb-mode-translate')
  const btnRot = document.getElementById('tb-mode-rotate')
  const btnScale = document.getElementById('tb-mode-scale')

async function performUndo() {
  if (undoStack.length === 0) {
    toast('Nada para deshacer', 'err')
    return
  }
  
  const prevState = undoStack.pop()
  const updates = []
  
  prevState.forEach(saved => {
    const ent = ents[saved.entityIndex]
    const basename = ent.src.split('/').pop()
    if (loaded[basename]) {
      const { root, bboxHelper } = loaded[basename]
      
      root.position.copy(saved.position)
      root.quaternion.copy(saved.quaternion)
      root.scale.copy(saved.scale)
      root.updateMatrixWorld()
      
      const nb = new THREE.Box3().setFromObject(root)
      loaded[basename].bbox.copy(nb)
      bboxHelper.box.copy(nb)

      ent.position = { x: saved.position.x, y: saved.position.y, z: saved.position.z }
      ent.rotation = { x: saved.quaternion.x, y: saved.quaternion.y, z: saved.quaternion.z, w: saved.quaternion.w }
      ent.scale = { x: saved.scale.x, y: saved.scale.y, z: saved.scale.z }

      updates.push({
        varName: ent.varName,
        x: parseFloat(saved.position.x.toFixed(2)),
        y: parseFloat(saved.position.y.toFixed(2)),
        z: parseFloat(saved.position.z.toFixed(2)),
        rx: parseFloat(saved.quaternion.x.toFixed(4)),
        ry: parseFloat(saved.quaternion.y.toFixed(4)),
        rz: parseFloat(saved.quaternion.z.toFixed(4)),
        rw: parseFloat(saved.quaternion.w.toFixed(4)),
        sx: parseFloat(saved.scale.x.toFixed(3)),
        sy: parseFloat(saved.scale.y.toFixed(3)),
        sz: parseFloat(saved.scale.z.toFixed(3))
      })
    }
  })
  
  updateSidebarInputs()
  updateGizmo()
  
  if (updates.length > 0) {
    try {
      const r = await fetch(`${API}/api/scene`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updates)
      })
      const d = await r.json()
      if (d.ok) {
        toast(`✓ Deshecho: ${updates.length} objeto(s) restaurado(s)`)
      }
    } catch {
      toast('Error de red al deshacer', 'err')
    }
  }
}

function getRootObject(object) {
  let curr = object
  while (curr && curr.parent) {
    if (curr.parent === scene || curr.parent === selectionGroup) {
      return curr
    }
    curr = curr.parent
  }
  return null
}

const dracoLoader = new DRACOLoader()
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/')
const gltfLoader = new GLTFLoader()
gltfLoader.setDRACOLoader(dracoLoader)

async function loadModel(filename) {
  setLoading(true)
  try {
    await new Promise((res, rej) => {
      gltfLoader.load(`${API}/api/model/${filename}`, gltf => {
        // Bevy/DCL renderiza la geometría de los GLB ESPEJADA EN X respecto a cómo
        // la carga Three.js. Verificado comparando contra el cliente Bevy real:
        // con este espejo (scale.x=-1) los karts caen EXACTO sobre el parking lot,
        // con sus líneas de estacionamiento, igual que en Bevy. (No es flip de Z.)
        // Las POSICIONES de entidad quedan LITERALES — el espejo va SOLO en la
        // geometría, dentro de flipGroup, sin afectar la posición que se guarda.
        const flipGroup = new THREE.Group()
        flipGroup.scale.x = -1
        gltf.scene.traverse(n => {
          if (n.isMesh) {
            n.castShadow = true
            n.receiveShadow = true
            // El espejo invierte el winding de los polígonos; DoubleSide evita que
            // la malla se vea negra/transparente por backface culling.
            const mats = Array.isArray(n.material) ? n.material : (n.material ? [n.material] : [])
            mats.forEach(m => { m.side = THREE.DoubleSide })
          }
        })
        flipGroup.add(gltf.scene)

        // Find all matching entities for this filename
        const matchingEnts = ents.map((e, idx) => ({ e, idx })).filter(item => {
          const entFilename = item.e.src.split('/').pop()
          return entFilename === filename
        })

        const instances = []

        if (matchingEnts.length > 0) {
          matchingEnts.forEach(item => {
            const ent = item.e
            const entIdx = item.idx

            const clonedFlipGroup = flipGroup.clone()
            const entityGroup = new THREE.Group()
            entityGroup.add(clonedFlipGroup)

            // Posición LITERAL — sin negar. Coincide con kartConfig.ts / index.ts / runtime.
            entityGroup.position.set(ent.position.x, ent.position.y, ent.position.z)
            if (ent.rotation) {
              entityGroup.quaternion.set(ent.rotation.x, ent.rotation.y, ent.rotation.z, ent.rotation.w)
            }
            if (ent.scale) {
              entityGroup.scale.set(ent.scale.x, ent.scale.y, ent.scale.z)
            }
            entityGroup.userData = {
              isEntity: true,
              entityIndex: entIdx,
              varName: ent.varName,
              filename: filename
            }

            scene.add(entityGroup)
            const bbox = new THREE.Box3().setFromObject(entityGroup)
            const bboxHelper = new THREE.Box3Helper(bbox, new THREE.Color(0x7c3aed))
            bboxHelper.visible = showBBox
            scene.add(bboxHelper)

            instances.push({ root: entityGroup, bbox, bboxHelper, varName: ent.varName })
          })
        } else {
          const entityGroup = new THREE.Group()
          entityGroup.add(flipGroup)
          entityGroup.userData = { filename }
          if (ents.length > 0) {
            const cx = ents.reduce((s,e) => s+e.position.x, 0) / ents.length
            const cy = ents.reduce((s,e) => s+e.position.y, 0) / ents.length
            const cz = ents.reduce((s,e) => s+e.position.z, 0) / ents.length
            const noEntIdx = Object.keys(loaded).length
            const col = noEntIdx % 5
            const row = Math.floor(noEntIdx / 5)
            entityGroup.position.set(cx + (col-2)*5, cy, cz + (row)*5 + 10)
          }
          scene.add(entityGroup)
          const bbox = new THREE.Box3().setFromObject(entityGroup)
          const bboxHelper = new THREE.Box3Helper(bbox, new THREE.Color(0x7c3aed))
          bboxHelper.visible = showBBox
          scene.add(bboxHelper)

          instances.push({ root: entityGroup, bbox, bboxHelper, varName: null })
        }

        loaded[filename] = {
          root: instances[0].root,
          bbox: instances[0].bbox,
          bboxHelper: instances[0].bboxHelper,
          instances: instances
        }
        document.getElementById('hmod').textContent = Object.keys(loaded).length
        renderModelList()
        if (Object.keys(loaded).length === 1) focusAll()
        res()
      }, undefined, rej)
    })
  } catch(e) { toast('Error cargando '+filename, 'err') }
  setLoading(false)
}

function unloadModel(filename) {
  if (!loaded[filename]) return
  const data = loaded[filename]
  
  if (data.instances) {
    data.instances.forEach(inst => {
      if (selectedObjects.includes(inst.root)) {
        clearSelection()
      }
      scene.remove(inst.root)
      scene.remove(inst.bboxHelper)
    })
  } else {
    if (selectedObjects.includes(data.root)) {
      clearSelection()
    }
    scene.remove(data.root)
    scene.remove(data.bboxHelper)
  }
  
  delete loaded[filename]
  document.getElementById('hmod').textContent = Object.keys(loaded).length
  renderModelList()
}

  const x = parseFloat(document.getElementById(`ex-${i}`).value)||0
  const y = parseFloat(document.getElementById(`ey-${i}`).value)||0
  const z = parseFloat(document.getElementById(`ez-${i}`).value)||0
  const data = loaded[key]
  const inst = data.instances ? data.instances.find(inst => inst.varName === ent.varName) : data
  if (!inst) return
  
  inst.root.position.set(x, y, z)
  const nb = new THREE.Box3().setFromObject(inst.root)
  inst.bboxHelper.box.copy(nb)
  
  if (selectedObjects.includes(inst.root)) {
    updateGizmo()
  }
}

async function saveEnt(i) {
  const ent = ents[i]
  const x = parseFloat(document.getElementById(`ex-${i}`).value)||0
  const y = parseFloat(document.getElementById(`ey-${i}`).value)||0
  const z = parseFloat(document.getElementById(`ez-${i}`).value)||0
  
  // Get current rotation and scale from the Three.js model if loaded, or keep defaults
  let rx = ent.rotation ? ent.rotation.x : 0
  let ry = ent.rotation ? ent.rotation.y : 0
  let rz = ent.rotation ? ent.rotation.z : 0
  let rw = ent.rotation ? ent.rotation.w : 1
  let sx = ent.scale ? ent.scale.x : 1
  let sy = ent.scale ? ent.scale.y : 1
  let sz = ent.scale ? ent.scale.z : 1
  
  const basename = ent.src.split('/').pop()
  const key = Object.keys(loaded).find(k => k === basename)
  if (key) {
    const data = loaded[key]
    const inst = data.instances ? data.instances.find(inst => inst.varName === ent.varName) : data
    if (inst) {
      const root = inst.root
      const worldRot = new THREE.Quaternion()
      root.getWorldQuaternion(worldRot)
      rx = parseFloat(worldRot.x.toFixed(4))
      ry = parseFloat(worldRot.y.toFixed(4))
      rz = parseFloat(worldRot.z.toFixed(4))
      rw = parseFloat(worldRot.w.toFixed(4))
      
      const worldScale = new THREE.Vector3()
      root.getWorldScale(worldScale)
      sx = parseFloat(worldScale.x.toFixed(3))
      sy = parseFloat(worldScale.y.toFixed(3))
      sz = parseFloat(worldScale.z.toFixed(3))
    }
  }

  try {
    const r = await fetch(`${API}/api/scene`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({varName: ent.varName, x, y, z, rx, ry, rz, rw, sx, sy, sz})
    })
    const d = await r.json()
    if (d.ok) {
      ents[i].position = {x,y,z}
      ents[i].rotation = {x:rx, y:ry, z:rz, w:rw}
      ents[i].scale = {x:sx, y:sy, z:sz}
      toast(`✓ ${ent.varName} → guardado`)
      const c = document.getElementById(`ec-${i}`)
      c?.classList.add('highlight')
      setTimeout(() => c?.classList.remove('highlight'), 1500)
    } else toast('Error: '+d.error, 'err')
  } catch { toast('Error de conexión', 'err') }
}

function focusEnt(i) {
  const ent = ents[i]
  const basename = ent.src.split('/').pop()
  const key = Object.keys(loaded).find(k => k === basename)
  if (!key) { toast('Cargá el modelo primero', 'err'); return }
  
  const data = loaded[key]
  const inst = data.instances ? data.instances.find(inst => inst.varName === ent.varName) : data
  if (!inst) return
  
  const obj = inst.root
  selectObject(obj, false)
  
  const sphere = new THREE.Sphere()
  inst.bbox.getBoundingSphere(sphere)
  const d = Math.max(sphere.radius*2.5, 30)
  const t = sphere.center
  ctrl.target.set(t.x, t.y, t.z)
  camera.position.set(t.x+d, t.y+d*.6, t.z+d)
  ctrl.update()
}

function updateGizmoPositionsUI() {
  selectedObjects.forEach(obj => {
    const entIdx = obj.userData.entityIndex
    if (entIdx !== undefined) {
      const worldPos = new THREE.Vector3()
      obj.getWorldPosition(worldPos)
      
      const ex = document.getElementById(`ex-${entIdx}`)
      const ey = document.getElementById(`ey-${entIdx}`)
      const ez = document.getElementById(`ez-${entIdx}`)
      
      if (ex) ex.value = worldPos.x.toFixed(1)
      if (ey) ey.value = worldPos.y.toFixed(1)
      if (ez) ez.value = worldPos.z.toFixed(1)

      ents[entIdx].position = { x: parseFloat(worldPos.x.toFixed(1)), y: parseFloat(worldPos.y.toFixed(1)), z: parseFloat(worldPos.z.toFixed(1)) }
    }
    
    const filename = obj.userData.filename
    if (loaded[filename]) {
      const data = loaded[filename]
      const inst = data.instances ? data.instances.find(inst => inst.root === obj) : data
      if (inst) {
        const nb = new THREE.Box3().setFromObject(obj)
        inst.bbox.copy(nb)
        inst.bboxHelper.box.copy(nb)
      }
    }
  })
}

async function saveSelectedPositions() {
  const updates = []
  selectedObjects.forEach(obj => {
    const entIdx = obj.userData.entityIndex
    if (entIdx !== undefined) {
      const ent = ents[entIdx]
      const worldPos = new THREE.Vector3()
      obj.getWorldPosition(worldPos)
      
      const worldRot = new THREE.Quaternion()
      obj.getWorldQuaternion(worldRot)
      
      const worldScale = new THREE.Vector3()
      obj.getWorldScale(worldScale)
      
      updates.push({
        varName: ent.varName,
        x: parseFloat(worldPos.x.toFixed(2)),
        y: parseFloat(worldPos.y.toFixed(2)),
        z: parseFloat(worldPos.z.toFixed(2)),  // Posición literal — coincide con archivos/runtime
        rx: parseFloat(worldRot.x.toFixed(4)),
        ry: parseFloat(worldRot.y.toFixed(4)),
        rz: parseFloat(worldRot.z.toFixed(4)),
        rw: parseFloat(worldRot.w.toFixed(4)),
        sx: parseFloat(worldScale.x.toFixed(3)),
        sy: parseFloat(worldScale.y.toFixed(3)),
        sz: parseFloat(worldScale.z.toFixed(3))
      })
    }
  })
  
  if (updates.length === 0) return
  
  try {
    const r = await fetch(`${API}/api/scene`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates)
    })
    const d = await r.json()
    if (d.ok) {
      toast(`✓ ${updates.length} objeto(s) guardado(s)`)
      updates.forEach(up => {
        const idx = ents.findIndex(e => e.varName === up.varName)
        if (idx !== -1) {
          const c = document.getElementById(`ec-${idx}`)
          c?.classList.add('highlight')
          setTimeout(() => c?.classList.remove('highlight'), 1500)
        }
      })
    } else {
      toast('Error: ' + d.error, 'err')
    }
  } catch (e) {
    toast('Error de conexión', 'err')
  }
  
  if (selectedObjects.length > 1) {
    const tempChildren = [...selectionGroup.children]
    tempChildren.forEach(child => {
      scene.attach(child)
    })
    
    const center = new THREE.Vector3()
    selectedObjects.forEach(obj => {
      const worldPos = new THREE.Vector3()
      obj.getWorldPosition(worldPos)
      center.add(worldPos)
    })
    center.divideScalar(selectedObjects.length)
    
    selectionGroup.position.copy(center)
    selectionGroup.rotation.set(0, 0, 0)
    selectionGroup.scale.set(1, 1, 1)
    selectionGroup.updateMatrixWorld()
    
    selectedObjects.forEach(obj => {
      selectionGroup.attach(obj)
    })
  }
}

function toggleGrid() {
  grid.visible = !grid.visible; axes.visible = !axes.visible
  document.getElementById('tb-grid').classList.toggle('on')
}
function toggleBBox() {
  showBBox = !showBBox
  Object.values(loaded).forEach(data => {
    if (data.instances) {
      data.instances.forEach(inst => inst.bboxHelper.visible = showBBox)
    } else {
      data.bboxHelper.visible = showBBox
    }
  })
  document.getElementById('tb-bbox').classList.toggle('on')
}
function toggleWire() {
  showWire = !showWire
  Object.values(loaded).forEach(data => {
    const roots = data.instances ? data.instances.map(inst => inst.root) : [data.root]
    roots.forEach(root => {
      root.traverse(n => { if(n.isMesh) n.material.wireframe = showWire })
    })
  })
  document.getElementById('tb-wire').classList.toggle('on')
}
function focusAll() {
  const ms = Object.values(loaded)
  if (!ms.length) return
  const all = new THREE.Box3()
  ms.forEach(data => {
    if (data.instances) {
      data.instances.forEach(inst => all.union(inst.bbox))
    } else {
      all.union(data.bbox)
    }
  })
  const c = new THREE.Vector3(); all.getCenter(c)
  const s = new THREE.Vector3(); all.getSize(s)
  const d = Math.max(s.length()*.8, 50)
  ctrl.target.copy(c)
  camera.position.set(c.x+d, c.y+d*.6, c.z+d)
  ctrl.update()
}

  camera.aspect = vp.clientWidth/vp.clientHeight
  camera.updateProjectionMatrix()
  renderer.setSize(vp.clientWidth, vp.clientHeight)
})

// ── EXPOSE GLOBALS (para onclick en el HTML) ──────────────────
window.toggleGrid  = toggleGrid
window.toggleBBox  = toggleBBox
window.toggleWire  = toggleWire
window.focusAll    = focusAll
window.loadAll     = loadAll
window.applyParcels= applyParcels
window.saveEnt     = saveEnt
window.focusEnt    = focusEnt
window.loadModel   = (n) => loaded[n] ? unloadModel(n) : loadModel(n)

// ── SPAWN AREA MESH ───────────────────────────────────────────
function createSpawnAreaMesh() {
  const spawnEnt = ents.find(e => e.isSpawnArea)
  if (!spawnEnt) return
  
  const size = spawnEnt.size || { x: 10, y: 1, z: 5 }
  const geomHeight = Math.max(size.y, 1.5)
  const geometry = new THREE.BoxGeometry(size.x, geomHeight, size.z)
  const material = new THREE.MeshBasicMaterial({
    color: 0x22c55e, // Green
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  })
  const mesh = new THREE.Mesh(geometry, material)
  mesh.position.set(spawnEnt.position.x, spawnEnt.position.y, spawnEnt.position.z)
  scene.add(mesh)
  
  const wireGeom = new THREE.BoxGeometry(size.x, geomHeight, size.z)
  const wireMat = new THREE.MeshBasicMaterial({
    color: 0x4ade80,
    wireframe: true
  })
  const wireMesh = new THREE.Mesh(wireGeom, wireMat)
  mesh.add(wireMesh)
  
  const bbox = new THREE.Box3().setFromObject(mesh)
  const bboxHelper = new THREE.Box3Helper(bbox, new THREE.Color(0x22c55e))
  bboxHelper.visible = showBBox
  scene.add(bboxHelper)
  
  loaded['SPAWN_AREA'] = {
    root: mesh,
    bbox,
    bboxHelper
  }
  
  mesh.userData = {
    isEntity: true,
    entityIndex: ents.indexOf(spawnEnt),
    varName: spawnEnt.varName,
    filename: 'SPAWN_AREA'
  }
}

// ── PANELES DE GRAFFITI (planos editables) ────────────────────
function createPanelMeshes() {
  const panelEnts = ents.filter(e => e.isPanel)
  for (const pe of panelEnts) {
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ color: 0xff4fa8, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false })
    )
    mesh.position.set(pe.position.x, pe.position.y, pe.position.z)
    if (pe.rotation) mesh.quaternion.set(pe.rotation.x, pe.rotation.y, pe.rotation.z, pe.rotation.w)
    mesh.scale.set(pe.scale.x, pe.scale.y, pe.scale.z || 1)
    scene.add(mesh)
    // borde
    mesh.add(new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0xff9ed6, wireframe: true, side: THREE.DoubleSide })))
    // indicador del FRENTE (la cara que se pinta = +Z local) — esfera celeste, contra-escalada
    const front = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 10), new THREE.MeshBasicMaterial({ color: 0x00e5ff }))
    front.position.set(0, 0, 0.5)
    front.scale.set(1 / pe.scale.x, 1 / pe.scale.y, 1)
    mesh.add(front)

    const bbox = new THREE.Box3().setFromObject(mesh)
    const bboxHelper = new THREE.Box3Helper(bbox, new THREE.Color(0xff4fa8))
    bboxHelper.visible = showBBox
    scene.add(bboxHelper)
    loaded[pe.varName] = { root: mesh, bbox, bboxHelper }
    mesh.userData = { isEntity: true, entityIndex: ents.indexOf(pe), varName: pe.varName, filename: pe.varName }
  }
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  await Promise.all([fetchWorldInfo(), fetchEntities(), fetchModels()])
  createSpawnAreaMesh()
  createPanelMeshes()
  loadAll()
}
init()
</script>
